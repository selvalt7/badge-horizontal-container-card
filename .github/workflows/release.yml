name: Release

on: workflow_dispatch

jobs:
    release-bundle:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Release
              uses: softprops/action-gh-release@v1
              with:
                  draft: true
                  generate_release_notes: true
                  files: dist/*.js
